[workspace]
resolver = "2"
members = [
    "crates/nlp-engine-ind-core",
    "crates/nlp-engine-ind-languages",
    "crates/nlp-engine-ind-romanize",
    "crates/nlp-engine-ind-cli",
    "crates/nlp-engine-ind-ffi",
    "crates/nlp-engine-ind-uniffi",
    "crates/nlp-engine-ind-wasm",
]
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/nlp-engine-ind"
description = "Offline Indian conversational NLP engine — English to code-mixed Roman-script text"

[workspace.dependencies]
nlp-engine-ind-core = { path = "crates/nlp-engine-ind-core" }
nlp-engine-ind-languages = { path = "crates/nlp-engine-ind-languages" }
nlp-engine-ind-romanize = { path = "crates/nlp-engine-ind-romanize" }
nlp-engine-ind-uniffi = { path = "crates/nlp-engine-ind-uniffi" }
nlp-engine-ind-wasm = { path = "crates/nlp-engine-ind-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
uniffi = { version = "0.29", features = ["cli"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
