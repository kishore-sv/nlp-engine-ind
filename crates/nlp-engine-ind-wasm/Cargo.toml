[package]
name = "nlp-engine-ind-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for nlp-engine-ind"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nlp-engine-ind-core = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = "0.1"

[features]
default = ["kannada", "hindi", "telugu", "tamil", "malayalam"]
kannada = ["nlp-engine-ind-core/kannada"]
hindi = ["nlp-engine-ind-core/hindi"]
telugu = ["nlp-engine-ind-core/telugu"]
tamil = ["nlp-engine-ind-core/tamil"]
malayalam = ["nlp-engine-ind-core/malayalam"]
